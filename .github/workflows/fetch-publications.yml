name: Fetch new publications

on:
  schedule:
    # Run every Monday at 09:00 UTC (17:00 CST)
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No pip deps: impact factors come from the committed JCR data file
      # (scripts/data/jcr_2025.json) via scripts/jcr_lookup.py, stdlib only.

      - name: Run publication fetcher
        id: fetch
        run: |
          python scripts/fetch_publications.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check for publication updates
        id: check
        run: |
          if git diff --quiet _bibliography/papers.bib; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No publication updates found."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Publication updates detected!"
          fi

      - name: Commit and push publication updates
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _bibliography/papers.bib
          git commit -m "chore(auto): update publications from scholarly metadata

          Automatically refreshed by fetch-publications workflow."
          git push

      - name: Create notification issue
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Publication records were automatically refreshed from scholarly metadata sources.\n\n';
            try {
              body += fs.readFileSync('scripts/new_papers_summary.md', 'utf8');
            } catch (e) {
              body += 'See the latest commit for details.';
            }
            body += '\n\n---\n*Please review the new entries and add missing fields (`category`, `subcategory`, `selected`, `preview`, etc.) as needed.*';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📄 Publication metadata automatically updated`,
              body: body,
              labels: ['publications', 'automated'],
              assignees: ['Wu-Zzz']
            });
